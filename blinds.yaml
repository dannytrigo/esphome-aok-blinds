# Example: Sonoff RF Bridge v2 with direct-hack mod, controlling A-OK blinds.
#
# Place this file alongside the `components/` directory. The directory layout
# should look like:
#
#   my-esphome-config/
#   ├── blinds.yaml         <-- this file
#   └── components/
#       └── aok/
#           ├── __init__.py
#           ├── aok.h / aok.cpp
#           ├── cover.py / cover.h / cover.cpp
#           └── button.py / aok_button.h

esphome:
  name: blinds-bridge

esp8266:
  board: esp8285

logger:
  level: DEBUG       # turn down to INFO once everything works
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Tell ESPHome where to find the component.
external_components:
  - source:
      type: local
      path: components

# The actual 433 MHz transmitter on the RF Bridge.
# Try GPIO5 first; if no response, swap to GPIO4 -- some board revisions
# have the markings swapped relative to the actual ESP pins.
remote_transmitter:
  id: tx
  pin: GPIO5
  carrier_duty_percent: 100%

# The A-OK hub: one per "virtual remote" you want to emulate.
# remote_id is a 24-bit value you make up. Once you've paired a motor to
# this ID, never change it (or you'll have to re-pair every blind).
#
# Each entry under `blinds:` automatically creates:
#   - a Cover entity  (name as given)
#   - a Button entity "{name} Pair"     (for pairing the motor)
#   - a Button entity "{name} Reverse"  (for reversing direction)
aok:
  id: aok_hub
  transmitter_id: tx
  remote_id: 0x8A3F71
  repeats: 8         # original remotes send 8-10 repeats; default is 8
  blinds:
    - name: "Bedroom"
      channel: 1
      travel_time: 25s    # roughly how long full open->close takes

    - name: "Kitchen"
      channel: 2
      travel_time: 25s

    - name: "Living Room A"
      channel: 3
      travel_time: 25s

    - name: "Living Room B"
      channel: 4
      travel_time: 25s

    - name: "Office"
      channel: 5
      travel_time: 25s

    - name: "Bathroom"
      channel: 6
      travel_time: 25s

    - name: "Hallway"
      channel: 7
      travel_time: 25s
